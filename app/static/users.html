<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users | Smart Warehouse</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/users.js"></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <main class="content" id="main" hidden>
        <div class="page-head">
          <div>
            <h1>Users</h1>
            <p>Users are deactivated, never deleted, because their movements stay in the history.</p>
          </div>
        </div>

        <form class="panel" id="create-form" novalidate>
          <h2>Add a user</h2>
          <p id="create-message" class="msg" hidden></p>
          <div class="form-grid">
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" maxlength="100" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" maxlength="255" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
              <span class="hint">At least 8 characters</span>
            </div>
            <div class="field">
              <label for="role">Role</label>
              <select id="role" name="role"></select>
            </div>
          </div>
          <div class="actions">
            <button class="btn" type="submit">Add user</button>
          </div>
        </form>

        <p id="message" class="msg" hidden></p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>

        <dialog id="edit-dialog" aria-labelledby="edit-title">
          <form id="edit-form" novalidate>
            <h2 id="edit-title">Edit user</h2>
            <p id="edit-message" class="msg" hidden></p>
            <div class="form-grid">
              <div class="field field-wide">
                <label for="edit-name">Name</label>
                <input id="edit-name" name="name" maxlength="100" required />
              </div>
              <div class="field">
                <label for="edit-role">Role</label>
                <select id="edit-role" name="role"></select>
              </div>
              <label class="check field"><input name="is_active" type="checkbox" /> Active</label>
              <div class="field field-wide">
                <label for="edit-password">New password (optional)</label>
                <input id="edit-password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" />
                <span class="hint">Leave empty to keep the current password.</span>
              </div>
            </div>
            <div class="actions">
              <button class="btn btn-quiet" type="button" data-close>Cancel</button>
              <button class="btn" type="submit">Save changes</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
